<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>Guitare Lab Pro</title>
<style>

  header { background: #1e293b; border-bottom: 1px solid #334155; padding: 10px 14px; position: sticky; top: 0; z-index: 40; }
  header h1 { margin: 0 0 6px 0; font-size: 17px; color: #38bdf8; }
  .studio-bar { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .wrap { max-width: 1150px; margin: 0 auto; padding: 12px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px 0; font-size: 17px; }
  .card h3 { margin: 12px 0 6px 0; font-size: 13px; color: #38bdf8; text-transform: uppercase; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; font-weight: bold; }
  select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; margin-bottom: 10px; }
  .grid { display: table; width: 100%; }
  .col { display: table-cell; width: 50%; padding-right: 6px; vertical-align: top; }
  .col:last-child { padding-right: 0; padding-left: 6px; }
  @media (max-width: 600px) { .col { display: block; width: 100%; padding: 0; } }
  .btn { display: inline-block; padding: 10px 13px; border-radius: 8px; border: none; background: #0284c7; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; margin: 2px; min-height: 42px; }
  .btn-sm { padding: 6px 10px; font-size: 12px; min-height: 34px; }
  .btn-rand { background: #7c3aed; }
  .btn-save { background: #059669; }
  .btn-sec { background: #334155; }
  .btn-del { background: #dc2626; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; background: #0f172a; color: #38bdf8; border: 1px solid #334155; margin: 0 4px 6px 0; }
  .chord-box { display: inline-block; background: #0f172a; border: 1px solid #38bdf8; border-radius: 10px; padding: 8px 10px; margin: 4px; min-width: 120px; vertical-align: top; }
  .chord-box strong { display: block; font-size: 17px; color: #38bdf8; }
  .deg { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin: 2px 2px 0 0; }
  .d-R { background: #dc2626; color: #fff; }
  .d-3 { background: #0284c7; color: #fff; }
  .d-5 { background: #059669; color: #fff; }
  .d-7 { background: #d97706; color: #fff; }
  .tab { width: 100%; background: #ffffff; color: #0f172a; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; font-family: "Courier New", Courier, monospace; font-size: 13px; line-height: 1.35; white-space: pre; overflow-x: auto; margin: 8px 0; }
  .tone-tip { background: #0f172a; border-left: 3px solid #fbbf24; padding: 9px 12px; border-radius: 6px; font-size: 13px; margin-top: 8px; }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 62px; background: #1e293b; border-top: 1px solid #334155; display: table; width: 100%; z-index: 50; }
  .nav-btn { display: table-cell; width: 25%; text-align: center; vertical-align: middle; color: #94a3b8; font-size: 12px; font-weight: bold; cursor: pointer; }
  .nav-btn.active { color: #38bdf8; background: #0f172a; }
  @media print { body { background: #fff !important; color: #000 !important; } header, .nav, .no-print { display: none !important; } .card { background: #fff !important; border: 1px solid #999 !important; } }

</header>

      <button class="btn btn-rand" onclick="genProg(true)">🎲 Aléatoire</button>
      <button class="btn btn-save" onclick="saveFav()">⭐ Sauvegarder</button>
      <button class="btn btn-sec" onclick="window.print()">🖨️ Imprimer</button>

    <div id="prog-res"></div>
  </div>
  <div id="p-exo" class="panel">

      <h2>🎯 Exercices sur Mesure</h2>
      <div class="grid">
        <div class="col"><label>Instrument</label><select id="ex-inst"><option value="Stratocaster">Fender Stratocaster</option><option value="Les Paul">Gibson Les Paul</option><option value="Acoustique">Guitare Acoustique (Doigts nus)</option></select></div>
        <div class="col"><label>Niveau</label><select id="ex-lvl"><option value="Débutant">Débutant</option><option value="Intermédiaire" selected>Intermédiaire</option><option value="Avancé">Avancé</option></select></div>

      <button class="btn btn-rand" onclick="genExo(true)">🎲 Aléatoire</button>
      <button class="btn btn-save" onclick="saveFav()">⭐ Sauvegarder</button>
      <button class="btn btn-sec" onclick="window.print()">🖨️ Imprimer</button>
    </div>
    <div id="exo-res"></div>
  </div>
  <div id="p-tun" class="panel">
    <div class="card">
      <h2>🎵 Accordeur de Référence (La 440 Hz)</h2>
      <button class="btn" onclick="playTone(82.41,'E2 (6e)')">E2 (6e)</button>
      <button class="btn" onclick="playTone(110.00,'A2 (5e)')">A2 (5e)</button>
      <button class="btn" onclick="playTone(146.83,'D3 (4e)')">D3 (4e)</button>

      <button class="btn btn-rand" onclick="playTone(440.00,'La 440 Hz')">La 440 Hz</button>
      <button class="btn btn-del" onclick="stopTone()">⏹ Stop</button>
      <div id="tun-msg" style="margin-top:8px;color:#38bdf8;font-weight:bold;"></div>
    </div>
  </div>
  <div id="p-fav" class="panel">
    <div class="card no-print"><h2>⭐ Mes Favoris (<span id="fav-n">0</span>)</h2></div>
    <div id="fav-list"></div>
  </div>
</div>
<nav class="nav no-print">

  var endF = startF + 4;
  var head = "   ";
  for (var f = startF; f <= endF; f++) head += (f < 10 ? " " + f + "  " : " " + f + " ");
  var grid = head + "\n";
  for (var s = 0; s < 6; s++) {
    var line = sNames.slice(s, s + 1).pop(), o = OPEN_STR.slice(s, s + 1).pop();
    for (var fr = startF; fr <= endF; fr++) {
      var nn = NOTES.slice((o + fr) % 12, ((o + fr) % 12) + 1).pop(), inS = false;
      for (var n = 0; n < scaleNotes.length; n++) if (norm(scaleNotes.slice(n, n + 1).pop()) === nn) inS = true;
      if (inS) {
        var diff = (NOTES.indexOf(nn) - tIdx + 12) % 12;
        line += (diff === 0 ? "[R]" : ((diff === 3 || diff === 4) ? "(3)" : (diff === 7 ? "(5)" : ((diff === 10 || diff === 11) ? "(7)" : " • ")))) + "|";
      } else line += "---|";
    }
    grid += line + "\n";
  }
  return '<div style="background:#0f172a;padding:8px 10px;border-radius:8px;margin-bottom:8px;border:1px solid #334155;"><div style="font-size:12px;font-weight:bold;color:#38bdf8;margin-bottom:4px;">' + title + ' (Cases ' + startF + '-' + endF + ')</div><div class="tab" style="margin:4px 0;font-size:12px;">' + grid + '</div></div>';
}
function genProg(rnd) {
  var ks=["C","G","D","A","E","F"], ss=["Fingerstyle","Neo-Soul","Blues-Rock","Pop-Blues"], is=["Stratocaster","Les Paul","Acoustique"], ls=["Débutant","Intermédiaire","Avancé"];
  if (rnd) {
    var rs = ss.slice(Math.floor(Math.random()*ss.length)).shift();
    document.getElementById("pg-key").value = ks.slice(Math.floor(Math.random()*ks.length)).shift();
    document.getElementById("pg-style").value = rs;
    document.getElementById("pg-inst").value = is.slice(Math.floor(Math.random()*is.length)).shift();
    document.getElementById("pg-lvl").value = ls.slice(Math.floor(Math.random()*ls.length)).shift();
    document.getElementById("pg-bars").value = (rs === "Blues-Rock") ? "12" : (Math.random() > 0.5 ? "8" : "16");
  }
  var k = document.getElementById("pg-key").value, st = document.getElementById("pg-style").value, inst = document.getElementById("pg-inst").value, lvl = document.getElementById("pg-lvl").value;
  var bars = parseInt(document.getElementById("pg-bars").value, 10) || 8;
  var kd = KEYS[k], plist = PATS[st], pat = plist.slice(Math.floor(Math.random()*plist.length)).shift();
  var seq = expandSeq(pat.d, bars, st), cHtml = "", chObjs = [], seen = {};
  curProgRoots = [];
  for (var i = 0; i < seq.length; i++) {
    var deg = seq.slice(i, i + 1).pop(), c = kd.ch[deg], an = anatomy(c.n);
    chObjs.push(c); curProgRoots.push(norm(an.R));
    if (!seen[deg]) {
      seen[deg] = true;
      cHtml += '<div class="chord-box"><small>Degré '+deg+'</small><strong>'+c.n+'</strong><div style="font-size:12px;margin:3px 0;">'+c.f+'</div><span class="deg d-R">R:'+an.R+'</span><span class="deg d-3">3:'+an.T+'</span><span class="deg d-5">5:'+an.Q+'</span><span class="deg d-7">7:'+an.S+'</span></div>';
    }
  }
  var tab = buildFullWidthTab(chObjs, st, lvl);
  curItem = {title: pat.t + " en " + k + " (" + bars + " mes.)", meta: inst + " • " + st + " • " + lvl, tab: tab, tip: INST[inst]};
  var h = '<div class="card"><span class="badge">'+st+'</span><span class="badge">'+bars+' mesures</span><span class="badge">'+inst+'</span><span class="badge">'+lvl+'</span><h2>'+pat.t+' ('+k+' / '+kd.rel+')</h2>';
  h += '<h3>1. Accords & Notes Cibles</h3><div>'+cHtml+'</div>';
  h += '<h3>2. Tablature Complète Pleine Largeur ('+bars+' Mesures)</h3><div class="tab">'+tab+'</div>';
  h += '<h3>3. Schémas des Gammes ([R]=Fondamentale, (3)=Tierce, (5)=Quinte, (7)=7e)</h3>';
  h += buildFretboard("Pentatonique Majeure de " + k, kd.pMaj, kd.r);
  h += buildFretboard("Gamme Blues / Mineure de " + kd.rel, kd.blues, kd.rel.replace("m",""));
  h += buildFretboard("Mode Dorien (Soul / Fusion)", kd.dor, kd.dor.slice(0,1).pop());
  h += '<div class="tone-tip">🎸 <strong>Réglage '+inst+' :</strong> '+INST[inst]+'</div></div>';
  document.getElementById("prog-res").innerHTML = h;
}
function genExo(rnd) {
  var is=["Stratocaster","Les Paul","Acoustique"], ls=["Débutant","Intermédiaire","Avancé"], ts=["Fingerpicking","Hybrid Picking","Bends & Vibrato","Double-Stops","Harmoniques","Voicings & Slap"];
  if (rnd) {
    document.getElementById("ex-inst").value = is.slice(Math.floor(Math.random()*is.length)).shift();
    document.getElementById("ex-lvl").value = ls.slice(Math.floor(Math.random()*ls.length)).shift();
    document.getElementById("ex-theme").value = ts.slice(Math.floor(Math.random()*ts.length)).shift();
  }
  var inst = document.getElementById("ex-inst").value, lvl = document.getElementById("ex-lvl").value, th = document.getElementById("ex-theme").value;
  var pool = [];
  for (var i = 0; i < EXOS.length; i++) { var it = EXOS.slice(i,i+1).pop(); if (it.th === th) pool.push(it); }
  if (pool.length === 0) pool = EXOS;
  var ex = pool.slice(Math.floor(Math.random()*pool.length)).shift();
  var sh = Math.floor(Math.random()*4);
  var tb = (sh > 0 && th !== "Harmoniques") ? "(Transposition +"+sh+" cases)\n" + ex.tab.replace(/([1-9])/g, function(m){return String(parseInt(m,10)+sh);}) : ex.tab;
  curItem = {title: ex.t + " (" + ex.st + ")", meta: inst + " • " + th + " • " + lvl, tab: tb, tip: ex.tip};
  var h = '<div class="card"><span class="badge">'+th+'</span><span class="badge">'+ex.st+'</span><span class="badge">'+inst+'</span><span class="badge">'+lvl+' • '+ex.bpm+'</span>';
  h += '<h2>'+ex.t+'</h2><div class="tab">'+tb+'</div><p>🎯 '+ex.tip+'</p><div class="tone-tip">🎸 <strong>Config '+inst+' :</strong> '+INST[inst]+'</div></div>';
  document.getElementById("exo-res").innerHTML = h;
}
var aCtx = null, tOsc = null, mInt = null, bInt = null, bMode = "", sInt = null, bpm = 80, beat = 0;
function initA() { if (!aCtx) { var C = window.AudioContext || window.webkitAudioContext; if (C) aCtx = new C(); } if (aCtx && aCtx.state === "suspended") aCtx.resume(); }
function playTone(f, txt) { initA(); stopTone(); if (!aCtx) return; tOsc = aCtx.createOscillator(); var g = aCtx.createGain(); tOsc.type = "triangle"; tOsc.frequency.value = f; g.gain.value = 0.25; tOsc.connect(g); g.connect(aCtx.destination); tOsc.start(0); document.getElementById("tun-msg").innerHTML = "🔊 " + txt + " (" + f + " Hz)"; }
function stopTone() { if (tOsc) { try { tOsc.stop(0); } catch(e) {} tOsc = null; } document.getElementById("tun-msg").innerHTML = ""; }
function chgBpm(d) { bpm = Math.max(45, Math.min(200, bpm + d)); document.getElementById("bpm-lbl").innerHTML = bpm + " BPM"; if (mInt) { toggleMetro(); toggleMetro(); } if (bInt) { var m = bMode; stopBacking(); toggleBacking(m); } }
function beep(freq, dur, vol, type) { if (!aCtx) return; var o = aCtx.createOscillator(), g = aCtx.createGain(); o.type = type || "triangle"; o.frequency.value = freq; g.gain.value = vol; o.connect(g); g.connect(aCtx.destination); o.start(0); o.stop(aCtx.currentTime + dur); }
function toggleMetro() {
  initA(); var btn = document.getElementById("btn-met");
  if (mInt) { clearInterval(mInt); mInt = null; btn.innerHTML = "⏱ Métro"; btn.className = "btn btn-sm btn-sec"; return; }
  btn.innerHTML = "⏹ Stop Métro"; btn.className = "btn btn-sm btn-del";
  beep(880, 0.04, 0.2);
  mInt = setInterval(function() { beep(880, 0.04, 0.2); }, Math.round(60000 / bpm));
}
function stopBacking() {
  if (bInt) { clearInterval(bInt); bInt = null; }
  bMode = "";
  document.getElementById("btn-back").innerHTML = "▶ Basse+Batterie"; document.getElementById("btn-back").className = "btn btn-sm btn-save";
  document.getElementById("btn-drum").innerHTML = "🥁 Batterie seule"; document.getElementById("btn-drum").className = "btn btn-sm";
}
function toggleBacking(mode) {
  initA();
  var wasSame = (bInt && bMode === mode);
  stopBacking();
  if (wasSame) return;
  bMode = mode; beat = 0;
  if (mode === "bass") { document.getElementById("btn-back").innerHTML = "⏹ Stop"; document.getElementById("btn-back").className = "btn btn-sm btn-del"; }
  else { document.getElementById("btn-drum").innerHTML = "⏹ Stop"; document.getElementById("btn-drum").className = "btn btn-sm btn-del"; }
  function step() {
    var b4 = beat % 4;
    if (b4 === 0 || b4 === 2) beep(65, 0.08, 0.35, "sine");
    if (b4 === 1 || b4 === 3) beep(220, 0.06, 0.18, "square");
    beep(1800, 0.015, 0.06, "triangle");
    if (mode === "bass" && (b4 === 0 || b4 === 2)) {
      var barIdx = Math.floor(beat / 4) % curProgRoots.length;
      var note = curProgRoots.slice(barIdx, barIdx + 1).pop();
      beep(BASS_FREQ[note] || 82.41, 0.38, 0.30, "triangle");
    }
    beat++;
  }
  step();
  bInt = setInterval(step, Math.round(60000 / bpm));
}
function toggleScroll() {
  var btn = document.getElementById("btn-scr");
  if (sInt) { clearInterval(sInt); sInt = null; btn.innerHTML = "⬇ Défil."; btn.className = "btn btn-sm btn-rand"; return; }
  btn.innerHTML = "⏸ Stop"; btn.className = "btn btn-sm btn-del";
  sInt = setInterval(function() { window.scrollBy(0, 1); }, 45);
}
function saveFav() { if (!curItem) return; favs.unshift(curItem); try { localStorage.setItem("glab_f", JSON.stringify(favs)); } catch(e) {} renderFavs(); alert("Sauvegardé !"); }
function delFav(i) { favs.splice(i,1); try { localStorage.setItem("glab_f", JSON.stringify(favs)); } catch(e) {} renderFavs(); }
function renderFavs() {
  document.getElementById("fav-n").innerHTML = favs.length;
  var h = "";
  for (var i = 0; i < favs.length; i++) {
    var f = favs.slice(i,i+1).pop();
    h += '<div class="card"><span class="badge">'+f.meta+'</span><h2>'+f.title+'</h2><div class="tab">'+f.tab+'</div><p style="font-size:13px;">'+f.tip+'</p><button class="btn btn-sec no-print" onclick="window.print()">🖨️ Imprimer</button> <button class="btn btn-del no-print" onclick="delFav('+i+')">🗑️ Supprimer</button></div>';
  }
  document.getElementById("fav-list").innerHTML = h || '<div class="card"><p>Aucun favori enregistré.</p></div>';
}
window.onresize = function() { if (document.getElementById("p-prog").className.indexOf("active") !== -1) genProg(false); };
renderFavs();
genProg(false);
genExo(false);
</script>
