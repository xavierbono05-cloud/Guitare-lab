<head>
<meta charset="UTF-8">

<title>Guitare Lab Pro</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  body { margin: 0; background: #0f172a; color: #f8fafc; padding-bottom: 75px; }
  .top-bar { position: sticky; top: 0; z-index: 50; background: #1e293b; padding: 10px; border-bottom: 1px solid #334155; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 12px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  h1 { font-size: 18px; margin: 0 8px 0 0; color: #38bdf8; }
  h2 { font-size: 17px; margin: 0 0 12px 0; color: #f8fafc; }
  h3 { font-size: 14px; margin: 14px 0 8px 0; color: #94a3b8; }

  .lock-btn.locked { background: #7f1d1d; border-color: #ef4444; color: #fff; }
  .btn { background: #0284c7; color: #fff; border: none; border-radius: 8px; padding: 9px 12px; font-size: 13px; font-weight: bold; cursor: pointer; }
  .btn-sm { padding: 6px 9px; font-size: 12px; }
  .btn-rand { background: #7c3aed; }
  .btn-sec { background: #334155; }
  .btn-del { background: #dc2626; }
  .badge { display: inline-block; background: #0369a1; color: #e0f2fe; font-size: 11px; padding: 3px 8px; border-radius: 99px; margin: 0 4px 6px 0; }
  .chord-box { display: inline-block; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px; margin: 0 6px 6px 0; min-width: 95px; text-align: center; }
  .chord-box small { display: block; color: #94a3b8; font-size: 10px; }
  .chord-box strong { display: block; font-size: 16px; color: #38bdf8; }
  .deg { display: inline-block; font-size: 10px; padding: 1px 4px; border-radius: 4px; margin: 1px; color: #fff; }
  .d-R { background: #dc2626; } .d-3 { background: #0284c7; } .d-5 { background: #059669; } .d-7 { background: #d97706; }
  .tab { background: #020617; color: #e2e8f0; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre; line-height: 1.35; border: 1px solid #334155; }
  .tone-tip { background: rgba(245,158,11,0.12); border-left: 3px solid #f59e0b; padding: 8px 10px; font-size: 12px; margin-top: 10px; border-radius: 4px; }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; border-top: 1px solid #334155; display: flex; z-index: 50; }
  .nav-btn { flex: 1; text-align: center; padding: 10px 4px; font-size: 12px; color: #94a3b8; cursor: pointer; }
  .nav-btn.active { color: #38bdf8; font-weight: bold; background: #0f172a; }
  @media print { .no-print { display: none !important; } body { background: #fff; color: #000; } }
</style>
</head>
<body>
<div class="top-bar no-print">

  <button class="btn btn-sm" id="btn-play" onclick="toggleAudio('band')">▶ Basse+Batterie</button>

var LOCKS = { inst: false, lvl: false, key: false, style: false };
function initStyleMenu() {
  var sel = document.getElementById('styleSelect');
  if (!sel) return;
  sel.innerHTML = '';
  var keys = Object.keys(PATS);
  for (var i = 0; i < keys.length; i++) {

function goTab(id, el) {
  var p = document.getElementsByClassName("panel");
  for (var i = 0; i < p.length; i++) p.item(i).className = "panel";
  document.getElementById("p-" + id).className = "panel active";

  for (var j = 0; j < b.length; j++) b.item(j).className = "nav-btn";
  if (el) el.className = "nav-btn active";
}
function norm(n) { return n.replace("Bb","A#").replace("Ab","G#").replace("Eb","D#").replace("Db","C#").replace("Gb","F#"); }
function anatomy(name) {
  var r = name.match(/^[A-G][#b]?/).toString();
  var min = (name.indexOf("m") !== -1 && name.indexOf("maj") === -1);
  var idx = NOTES.indexOf(norm(r)); if (idx < 0) idx = 0;
  return {R:r, T:NOTES[(idx+(min?3:4))%12], Q:NOTES[(idx+7)%12], S:NOTES[(idx+(name.indexOf("maj")!==-1?11:10))%12]};
}
function buildDynamicKey(kName, modeKey) {
  var kObj = KEYS[kName] || KEYS.C;
  var mObj = MODES[modeKey] || MODES.ionian;
  var scaleArr = kObj.flat ? NOTES_FLAT : NOTES_SHARP;
  var rIdx = kObj.idx;
  var scaleNotes = new Array();
  for (var i = 0; i < mObj.intervals.length; i++) {
    var iv = mObj.intervals.slice(i, i + 1).pop();
    scaleNotes.push(scaleArr.slice((rIdx + iv) % 12, ((rIdx + iv) % 12) + 1).pop());
  }
  var SHAPES = {
    maj7: 'x-3-2-0-0-0', m7: 'x-0-2-0-1-0', '7': '3-2-0-0-0-1', m7b5: 'x-1-2-1-2-x',
    mMaj7: 'x-0-2-1-1-0', 'maj7#5': 'x-3-2-1-0-0', dim7: 'x-1-2-0-2-0'
  };
  var chMap = {};
  for (var d = 1; d <= 7; d++) {
    var idx = (d - 1) % scaleNotes.length;
    var rn = scaleNotes.slice(idx, idx + 1).pop();
    var q = mObj.chords.slice(idx, idx + 1).pop();
    chMap[String(d)] = { n: rn + q, f: SHAPES[q] || 'x-3-2-0-1-0' };
  }
  var blues = new Array(0, 3, 5, 6, 7, 10).map(function(s) {
    return scaleArr.slice((rIdx + s) % 12, ((rIdx + s) % 12) + 1).pop();
  });
  return { r: kName, ch: chMap, blues: blues, modeLabel: mObj.label, scaleNotes: scaleNotes };
}

function buildFullWidthTab(chords, style, lvl) {
  var w = window.innerWidth || 768, perRow = (w >= 680) ? 4 : 2;
  var charsPerBar = Math.max(12, Math.floor(((w - 65) / 7.8 - perRow - 2) / perRow)), dash = "";
  for (var d = 0; d < charsPerBar; d++) dash += "-";
  var strNames = new Array("e|","B|","G|","D|","A|","E|"), blocks = new Array();
  for (var i = 0; i < chords.length; i++) {
    var c = chords.slice(i, i + 1).pop(), p = c.f.split("-");
    var e6 = p.slice(0,1).pop(), a5 = p.slice(1,2).pop(), d4 = p.slice(2,3).pop();
    var g3 = p.slice(3,4).pop(), b2 = p.slice(4,5).pop(), e1 = p.slice(5,6).pop();
    var bStr = (e6 !== "x") ? 5 : 4, bVal = (e6 !== "x") ? e6 : a5;
    var col = new Array(dash, dash, dash, dash, dash, dash);
    function put(row, ratio, val) {
      if (!val || val === "x") return;
      var pos = Math.max(1, Math.min(charsPerBar - val.length - 1, Math.floor(charsPerBar * ratio)));
      var s = col.slice(row, row + 1).pop();
      col.splice(row, 1, s.substring(0, pos) + val + s.substring(pos + val.length));
    }
    put(bStr, 0.05, bVal); put(3, 0.25, d4); put(2, 0.45, g3); put(1, 0.65, b2);
    if (lvl !== "Débutant") put(0, 0.82, e1);
    blocks.push({name: c.n, lines: col});
  }
  var out = "";
  for (var m = 0; m < blocks.length; m += perRow) {
    var sl = blocks.slice(m, m + perRow), hdr = "Mes. " + (m + 1) + "-" + (m + sl.length) + " : ";
    for (var h = 0; h < sl.length; h++) hdr += sl.slice(h, h + 1).pop().name + (h < sl.length - 1 ? " | " : "");
    out += hdr + "\n";
    for (var r = 0; r < 6; r++) {
      var rs = strNames.slice(r, r + 1).pop();

function startMicTuner() {
  initACtx();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert("Micro non supporté sur ce navigateur."); return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    var src = aCtx.createMediaStreamSource(stream), an = aCtx.createAnalyser();
    an.fftSize = 2048; src.connect(an);
    var buf = new Float32Array(an.fftSize);
    function loop() {
      an.getFloatTimeDomainData(buf);
      var rms = 0; for (var i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
      if (Math.sqrt(rms / buf.length) > 0.015) {
        var bestO = -1, bestC = 0;
        for (var o = 60; o < 600; o++) {
          var corr = 0; for (var j = 0; j < 700; j++) corr += buf[j] * buf[j + o];
          if (corr > bestC) { bestC = corr; bestO = o; }
        }
        if (bestO > 0) {
          var freq = aCtx.sampleRate / bestO, midi = Math.round(12 * (Math.log(freq / 440) / Math.LN2)) + 69;
          var exact = 440 * Math.pow(2, (midi - 69) / 12), cents = Math.round(1200 * Math.log(freq / exact) / Math.LN2);
          var nName = NOTES[((midi % 12) + 12) % 12], pin = document.getElementById("tun-pin"), nEl = document.getElementById("tun-note");
          nEl.textContent = nName; pin.style.left = Math.max(5, Math.min(95, 50 + cents)) + "%";
          var ok = Math.abs(cents) <= 5;
          pin.style.background = ok ? "#10b981" : "#f59e0b"; nEl.style.color = ok ? "#10b981" : "#38bdf8";
          document.getElementById("tun-cents").textContent = (ok ? "✓ Accordé ! (" : (cents > 0 ? "Trop haut +" : "Trop bas ")) + cents + " cents)";
        }
      }
      tunAnim = requestAnimationFrame(loop);
    }
    loop();
  }).catch(function() { alert("Autorisez l'accès au micro dans Safari."); });
}

function saveFav() { if (!curItem) return; favs.unshift(curItem); try { localStorage.setItem("glab_f", JSON.stringify(favs)); } catch(e) {} renderFavs(); alert("Sauvegardé !"); }
function delFav(i) { favs.splice(i,1); try { localStorage.setItem("glab_f", JSON.stringify(favs)); } catch(e) {} renderFavs(); }
function renderFavs() {
  document.getElementById("fav-n").textContent = favs.length;
  var h = "";
  for (var i = 0; i < favs.length; i++) {
    var f = favs[i];
    h += '<div class="card"><span class="badge">'+f.meta+'</span><h2>'+f.title+'</h2><div class="tab">'+f.tab+'</div><p style="font-size:13px;">'+f.tip+'</p><button class="btn btn-del no-print" onclick="delFav('+i+')">🗑️ Supprimer</button></div>';
  }
  document.getElementById("fav-list").innerHTML = h || '<div class="card"><p>Aucun favori enregistré.</p></div>';
}
