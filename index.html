<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0 0 75px 0; font-family: -apple-system, Arial, sans-serif; background: #0f172a; color: #f8fafc; font-size: 15px; }
  header { background: #1e293b; border-bottom: 1px solid #334155; padding: 10px 14px; position: sticky; top: 0; z-index: 40; }
  header h1 { margin: 0 0 6px 0; font-size: 17px; color: #38bdf8; }
  .studio-bar { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .wrap { max-width: 1150px; margin: 0 auto; padding: 12px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px 0; font-size: 17px; }
  .card h3 { margin: 12px 0 6px 0; font-size: 13px; color: #38bdf8; text-transform: uppercase; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; font-weight: bold; }
  select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; margin-bottom: 10px; }
  .grid { display: table; width: 100%; }
  .col { display: table-cell; width: 50%; padding-right: 6px; vertical-align: top; }
  .col:last-child { padding-right: 0; padding-left: 6px; }
  @media (max-width: 600px) { .col { display: block; width: 100%; padding: 0; } }
  .btn { display: inline-block; padding: 10px 13px; border-radius: 8px; border: none; background: #0284c7; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; margin: 2px; min-height: 42px; }
  .btn-sm { padding: 6px 10px; font-size: 12px; min-height: 34px; }
  .btn-rand { background: #7c3aed; }
  .btn-save { background: #059669; }
  .btn-sec { background: #334155; }
  .btn-del { background: #dc2626; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; background: #0f172a; color: #38bdf8; border: 1px solid #334155; margin: 0 4px 6px 0; }
  .chord-box { display: inline-block; background: #0f172a; border: 1px solid #38bdf8; border-radius: 10px; padding: 8px 10px; margin: 4px; min-width: 120px; vertical-align: top; }
  .chord-box strong { display: block; font-size: 17px; color: #38bdf8; }
  .deg { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin: 2px 2px 0 0; }
  .d-R { background: #dc2626; color: #fff; }
  .d-3 { background: #0284c7; color: #fff; }
  .d-5 { background: #059669; color: #fff; }
  .d-7 { background: #d97706; color: #fff; }
  .tab { width: 100%; background: #ffffff; color: #0f172a; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; font-family: "Courier New", Courier, monospace; font-size: 13px; line-height: 1.35; white-space: pre; overflow-x: auto; margin: 8px 0; }
  .tone-tip { background: #0f172a; border-left: 3px solid #fbbf24; padding: 9px 12px; border-radius: 6px; font-size: 13px; margin-top: 8px; }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 62px; background: #1e293b; border-top: 1px solid #334155; display: table; width: 100%; z-index: 50; }
  .nav-btn { display: table-cell; width: 25%; text-align: center; vertical-align: middle; color: #94a3b8; font-size: 12px; font-weight: bold; cursor: pointer; }
  .nav-btn.active { color: #38bdf8; background: #0f172a; }
  @media print { body { background: #fff !important; color: #000 !important; } header, .nav, .no-print { display: none !important; } .card { background: #fff !important; border: 1px solid #999 !important; } }
.ctrl-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.ctrl-row select { flex: 1; }
.lock-btn {
  background: #2a2a35; border: 1px solid #444; color: #aaa;
  border-radius: 6px; padding: 6px 9px; font-size: 14px; cursor: pointer;
}
.lock-btn.locked {
  background: #4a1c1c; border-color: #ff5555; color: #fff;
}
.guitar-tip {
  background: rgba(255,255,255,0.06); border-left: 3px solid #f59e0b;
  padding: 6px 10px; font-size: 12px; margin: 6px 0; border-radius: 4px;
}

var LOCKS = { inst: false, lvl: false, key: false, style: false };

function initStyleMenu() {
  var sel = document.getElementById('styleSelect');
  if (!sel) return;
  sel.innerHTML = '';
  var keys = Object.keys(PATS);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    var opt = document.createElement('option');
    opt.value = k;
    opt.textContent = (i + 1) + '. ' + PATS[k].name;
    sel.appendChild(opt);
  }
  updateGuitarTip();
}

function toggleLock(part) {
  LOCKS[part] = !LOCKS[part];
  var btn = document.getElementById('lock-' + part);
  if (btn) {
    btn.textContent = LOCKS[part] ? '🔒' : '🔓';
    if (LOCKS[part]) btn.className = 'lock-btn locked';
    else btn.className = 'lock-btn';
  }
}

function updateGuitarTip() {
  var inst = document.getElementById('instSelect').value;
  var box = document.getElementById('guitarTipBox');
  if (box && GUITARS[inst]) {
    box.textContent = '🎸 ' + GUITARS[inst].tip;
  }
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function randomizeSmart() {
  var styleKeys = Object.keys(PATS);
  var keyNames = Object.keys(KEYS);
  var lvls = ['deb', 'int', 'adv'];
  var modes = ['auto', 'major', 'minor', 'blues', 'modal'];

  if (!LOCKS.style) {
    document.getElementById('styleSelect').value = pickRandom(styleKeys);
  }
  var curStyle = PATS[document.getElementById('styleSelect').value];

  if (!LOCKS.inst) {
    var instKeys = Object.keys(GUITARS);
    document.getElementById('instSelect').value = LOCKS.style && curStyle ? curStyle.guitar : pickRandom(instKeys);
  }
  if (!LOCKS.lvl) {
    document.getElementById('lvlSelect').value = pickRandom(lvls);
  }
  if (!LOCKS.key) {
    document.getElementById('keySelect').value = pickRandom(keyNames);
    document.getElementById('modeSelect').value = LOCKS.style ? 'auto' : pickRandom(modes);
  }

  g.gain.setValueAtTime(0.01, now); g.gain.linearRampToValueAtTime(0.45, now + 0.02); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
  osc.connect(flt); flt.connect(g); g.connect(aCtx.destination);
  osc.start(now); osc.stop(now + dur);
}
function playKick() {
  if (!aCtx) return;
  var now = aCtx.currentTime, o = aCtx.createOscillator(), g = aCtx.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(145, now); o.frequency.exponentialRampToValueAtTime(42, now + 0.14);
  g.gain.setValueAtTime(0.65, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
  o.connect(g); g.connect(aCtx.destination); o.start(now); o.stop(now + 0.16);
}
function playSnare() {
  if (!aCtx || !noiseBuf) return;
  var now = aCtx.currentTime, src = aCtx.createBufferSource(), flt = aCtx.createBiquadFilter(), g = aCtx.createGain();
  src.buffer = noiseBuf; flt.type = "bandpass"; flt.frequency.value = 1400;
  g.gain.setValueAtTime(0.32, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
  src.connect(flt); flt.connect(g); g.connect(aCtx.destination); src.start(now); src.stop(now + 0.14);
}
function playHat() {
  if (!aCtx || !noiseBuf) return;
  var now = aCtx.currentTime, src = aCtx.createBufferSource(), flt = aCtx.createBiquadFilter(), g = aCtx.createGain();
  src.buffer = noiseBuf; flt.type = "highpass"; flt.frequency.value = 7000;
  g.gain.setValueAtTime(0.11, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
  src.connect(flt); flt.connect(g); g.connect(aCtx.destination); src.start(now); src.stop(now + 0.045);
}
function chgBpm(d) { bpm = Math.max(45, Math.min(200, bpm + d)); document.getElementById("bpm-lbl").innerHTML = bpm + " BPM"; if (mInt) { toggleMetro(); toggleMetro(); } if (bInt) { var m = bMode; stopBacking(); toggleBacking(m); } }
function toggleMetro() {
  initA(); var btn = document.getElementById("btn-met");
  if (mInt) { clearInterval(mInt); mInt = null; btn.innerHTML = "⏱ Métro"; btn.className = "btn btn-sm btn-sec"; return; }
  btn.innerHTML = "⏹ Stop Métro"; btn.className = "btn btn-sm btn-del";
  playHat();
  mInt = setInterval(function() { playHat(); }, Math.round(60000 / bpm));
}
function stopBacking() {
  if (bInt) { clearInterval(bInt); bInt = null; }
  bMode = "";
  document.getElementById("btn-back").innerHTML = "▶ Basse+Batterie"; document.getElementById("btn-back").className = "btn btn-sm btn-save";
  document.getElementById("btn-drum").innerHTML = "🥁 Batterie seule"; document.getElementById("btn-drum").className = "btn btn-sm";
}
function toggleBacking(mode) {
  initA(); var wasSame = (bInt && bMode === mode); stopBacking(); if (wasSame) return;
  bMode = mode; step8 = 0;
  if (mode === "bass") { document.getElementById("btn-back").innerHTML = "⏹ Stop"; document.getElementById("btn-back").className = "btn btn-sm btn-del"; }
  else { document.getElementById("btn-drum").innerHTML = "⏹ Stop"; document.getElementById("btn-drum").className = "btn btn-sm btn-del"; }
  function tick8() {
    var s = step8 % 8;
    playHat();
    if (s === 0 || s === 4 || s === 5) playKick();
    if (s === 2 || s === 6) playSnare();
    if (mode === "bass" && (s === 0 || s === 4 || s === 7)) {
      var barIdx = Math.floor(step8 / 8) % curProgRoots.length;
      var note = curProgRoots.slice(barIdx, barIdx + 1).pop();
      playBassNote(BASS_FREQ[note] || 82.41, (60 / bpm) * 1.6);
    }
    step8++;
  }
  tick8();
  bInt = setInterval(tick8, Math.round(30000 / bpm));
}
function playTone(f, txt) { initA(); stopTone(); if (!aCtx) return; tOsc = aCtx.createOscillator(); var g = aCtx.createGain(); tOsc.type = "triangle"; tOsc.frequency.value = f; g.gain.value = 0.25; tOsc.connect(g); g.connect(aCtx.destination); tOsc.start(0); document.getElementById("tun-msg").innerHTML = "🔊 " + txt + " (" + f + " Hz)"; }
function stopTone() { if (tOsc) { try { tOsc.stop(0); } catch(e) {} tOsc = null; } document.getElementById("tun-msg").innerHTML = ""; }
var micStream = null, analyser = null, tunAnim = null;
function initTunerUI() {
  var c = document.getElementById("p-tun").getElementsByClassName("card").item(0);
  if (document.getElementById("needle-box")) return;
  var div = document.createElement("div");
  div.id = "needle-box";
  div.style.cssText = "background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px;margin-bottom:12px;text-align:center;";
  div.innerHTML = '<button class="btn btn-save" id="btn-mic" onclick="toggleMicTuner()">🎙️ Activer Accordeur Micro</button>' +
    '<div id="tun-note" style="font-size:36px;font-weight:bold;color:#38bdf8;margin:8px 0;">--</div>' +

    '<div style="position:relative;height:24px;background:#1e293b;border-radius:12px;border:1px solid #475569;margin:8px auto;max-width:340px;">' +
    '<div style="position:absolute;left:50%;top:0;bottom:0;width:3px;background:#10b981;margin-left:-1.5px;"></div>' +
    '<div id="tun-pin" style="position:absolute;left:50%;top:2px;width:16px;height:18px;border-radius:9px;background:#38bdf8;margin-left:-8px;"></div></div>' +
    '<div id="tun-cents" style="font-size:13px;color:#94a3b8;">Jouez une corde devant le micro</div>';
  c.insertBefore(div, c.getElementsByTagName("button").item(0));
}
function toggleMicTuner() {
  initA(); var btn = document.getElementById("btn-mic");
  if (micStream) {
    cancelAnimationFrame(tunAnim);
    var tr = micStream.getTracks(); for (var i = 0; i < tr.length; i++) tr.slice(i, i + 1).pop().stop();
    micStream = null; btn.innerHTML = "🎙️ Activer Accordeur Micro"; btn.className = "btn btn-save"; return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert("Micro non disponible sur ce navigateur."); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream) {
    micStream = stream; btn.innerHTML = "⏹ Couper Micro"; btn.className = "btn btn-del";
    var src = aCtx.createMediaStreamSource(stream);
    analyser = aCtx.createAnalyser(); analyser.fftSize = 2048; src.connect(analyser);
    var buf = new Float32Array(analyser.fftSize);
    function loop() {
      analyser.getFloatTimeDomainData(buf);
      var rms = 0; for (var i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
      if (Math.sqrt(rms / buf.length) > 0.015) {
        var bestO = -1, bestC = 0;
        for (var o = 60; o < 700; o++) {
          var corr = 0; for (var j = 0; j < 800; j++) corr += buf[j] * buf[j + o];
          if (corr > bestC) { bestC = corr; bestO = o; }
        }
        if (bestO > 0) {
          var freq = aCtx.sampleRate / bestO;
          var midi = Math.round(12 * (Math.log(freq / 440) / Math.LN2)) + 69;
          var exact = 440 * Math.pow(2, (midi - 69) / 12);
          var cents = Math.round(1200 * Math.log(freq / exact) / Math.LN2);
          var nName = NOTES.slice(((midi % 12) + 12) % 12, (((midi % 12) + 12) % 12) + 1).pop();
          var pin = document.getElementById("tun-pin"), nEl = document.getElementById("tun-note");
          nEl.innerHTML = nName;
          var pct = Math.max(5, Math.min(95, 50 + cents));
          pin.style.left = pct + "%";
          var ok = Math.abs(cents) <= 5;
          pin.style.background = ok ? "#10b981" : "#f59e0b";
          nEl.style.color = ok ? "#10b981" : "#38bdf8";
          document.getElementById("tun-cents").innerHTML = (ok ? "✓ Accordé ! (" : (cents > 0 ? "Trop haut +" : "Trop bas ")) + cents + " cents)";
        }
      }
      tunAnim = requestAnimationFrame(loop);
    }
    loop();
  }).catch(function() { alert("Autorisez l'accès au micro dans Safari."); });
}
function toggleScroll() {
  var btn = document.getElementById("btn-scr");
  if (sInt) { clearInterval(sInt); sInt = null; btn.innerHTML = "⬇ Défil."; btn.className = "btn btn-sm btn-rand"; return; }
  btn.innerHTML = "⏸ Stop"; btn.className = "btn btn-sm btn-del";

}
function saveFav() { if (!curItem) return; favs.unshift(curItem); try { localStorage.setItem("glab_f", JSON.stringify(favs)); } catch(e) {} renderFavs(); alert("Sauvegardé !"); }
function delFav(i) { favs.splice(i,1); try { localStorage.setItem("glab_f", JSON.stringify(favs)); } catch(e) {} renderFavs(); }

  document.getElementById("fav-n").innerHTML = favs.length;
  var h = "";
  for (var i = 0; i < favs.length; i++) {
    var f = favs.slice(i,i+1).pop();

  }

}

   initStyleMenu();
