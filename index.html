<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Guitare Lab Pro</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  body { margin: 0; background: #0f172a; color: #f8fafc; padding-bottom: 75px; }
  .top-bar { position: sticky; top: 0; z-index: 50; background: #1e293b; padding: 10px; border-bottom: 1px solid #334155; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 12px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  h1 { font-size: 18px; margin: 0 8px 0 0; color: #38bdf8; }
  h2 { font-size: 17px; margin: 0 0 12px 0; color: #f8fafc; }
  h3 { font-size: 14px; margin: 14px 0 8px 0; color: #94a3b8; }
  label { display: block; font-size: 12px; color: #94a3b8; margin: 6px 0 3px 0; }
  .ctrl-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  select { flex: 1; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 8px; padding: 9px; font-size: 14px; }
  .lock-btn { background: #334155; border: 1px solid #475569; color: #cbd5e1; border-radius: 8px; padding: 8px 11px; font-size: 15px; cursor: pointer; }
  .lock-btn.locked { background: #7f1d1d; border-color: #ef4444; color: #fff; }
  .btn { background: #0284c7; color: #fff; border: none; border-radius: 8px; padding: 9px 12px; font-size: 13px; font-weight: bold; cursor: pointer; }
  .btn-sm { padding: 6px 9px; font-size: 12px; }
  .btn-rand { background: #7c3aed; }
  .btn-sec { background: #334155; }
  .btn-del { background: #dc2626; }
  .badge { display: inline-block; background: #0369a1; color: #e0f2fe; font-size: 11px; padding: 3px 8px; border-radius: 99px; margin: 0 4px 6px 0; }
  .chord-box { display: inline-block; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px; margin: 0 6px 6px 0; min-width: 95px; text-align: center; }
  .chord-box small { display: block; color: #94a3b8; font-size: 10px; }
  .chord-box strong { display: block; font-size: 16px; color: #38bdf8; }
  .deg { display: inline-block; font-size: 10px; padding: 1px 4px; border-radius: 4px; margin: 1px; color: #fff; }
  .d-R { background: #dc2626; } .d-3 { background: #0284c7; } .d-5 { background: #059669; } .d-7 { background: #d97706; }
  .tab { background: #ffffff; color: #0f172a; font-family: monospace; font-size: 12px; font-weight: bold; padding: 12px; border-radius: 8px; overflow-x: auto; white-space: pre; line-height: 1.4; border: 2px solid #94a3b8; }
  .tone-tip { background: rgba(245,158,11,0.12); border-left: 3px solid #f59e0b; padding: 8px 10px; font-size: 12px; margin-top: 10px; border-radius: 4px; }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; border-top: 1px solid #334155; display: flex; z-index: 50; }
  .nav-btn { flex: 1; text-align: center; padding: 10px 4px; font-size: 12px; color: #94a3b8; cursor: pointer; }
  .nav-btn.active { color: #38bdf8; font-weight: bold; background: #0f172a; }
  @media print { .no-print { display: none !important; } body { background: #fff; color: #000; } }
</style>
</head>
<body>
<div class="top-bar no-print">
  <h1>🎸 Guitare Lab Pro</h1>
  <button type="button" class="btn btn-sm" id="btn-play" onclick="toggleAudio('band')">▶ Basse+Batterie</button>
  <button type="button" class="btn btn-sm btn-sec" id="btn-drum" onclick="toggleAudio('drum')">🥁 Batterie</button>
  <button type="button" class="btn btn-sm btn-sec" onclick="chgBpm(-5)">-5</button>
  <span id="bpm-lbl" style="font-size:12px;font-weight:bold;">90 BPM</span>
  <button type="button" class="btn btn-sm btn-sec" onclick="chgBpm(5)">+5</button>
  <button type="button" class="btn btn-sm btn-sec" id="btn-met" onclick="toggleAudio('met')">⏱ Métro</button>
  <button type="button" class="btn btn-sm btn-rand" id="btn-scr" onclick="toggleScroll()">⬇ Défil.</button>
</div>
<div class="wrap">
  <div id="p-prog" class="panel active"><div class="card no-print"><h2>🎼 Progressions &amp; Gammes</h2><div id="prog-controls"></div></div><div id="prog-res"></div></div>
  <div id="p-exo" class="panel"><div class="card no-print"><h2>🎯 Exercices sur Mesure</h2><div id="exo-controls"></div></div><div id="exo-res"></div></div>
  <div id="p-tun" class="panel"><div class="card"><h2>🎵 Accordeur Chromatique &amp; La 440 Hz</h2><div id="tun-ui"></div></div></div>
  <div id="p-fav" class="panel"><div class="card"><h2>⭐ Mes Favoris (<span id="fav-n">0</span>)</h2></div><div id="fav-list"></div></div>
</div>
<nav class="nav no-print">
  <div class="nav-btn active" onclick="goTab('prog', this)">🎼 Grilles</div>
  <div class="nav-btn" onclick="goTab('exo', this)">🎯 Exercices</div>
  <div class="nav-btn" onclick="goTab('tun', this)">🎵 Accordeur</div>
  <div class="nav-btn" onclick="goTab('fav', this)">⭐ Favoris</div>
</nav>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
